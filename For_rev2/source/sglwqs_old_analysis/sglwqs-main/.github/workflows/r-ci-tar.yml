name: R CI (Install from tar.gz)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        r-version: ["4.3.1"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
          use-public-rspm: true

      - name: Install package dependencies
        run: |
          Rscript -e 'install.packages("remotes", repos = "https://cloud.r-project.org")'
          Rscript -e 'remotes::install_deps(".", dependencies = TRUE, upgrade = "never")'

      - name: Build source tar.gz
        run: R CMD build . --no-build-vignettes

      - name: Install sglwqs from tar.gz
        run: R CMD INSTALL sglwqs_*.tar.gz

      - name: Run package tests
        run: Rscript -e 'testthat::test_local(".", reporter = "summary")'
